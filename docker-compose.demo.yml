# Override para DEMO externo (prueba de cliente), sin TLS, expuesto por túnel.
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#
# Diferencias vs base (dev):
#   - Keycloak sirve bajo /auth (KC_HTTP_RELATIVE_PATH) para compartir origen.
#   - Frontend se compila con URLs relativas (/api, /auth) -> todo un solo origen.
#   - nginx frontal HTTP en 127.0.0.1:8090 rutea /,/api,/auth (lo publica el túnel).
# El login del SPA es ROPC (grant_type=password, POST relativo al token endpoint),
# así que NO depende de redirect_uri ni del hostname público de Keycloak.

services:
  keycloak:
    environment:
      KC_HTTP_RELATIVE_PATH: /auth

  # Keycloak sirve bajo /auth en demo -> kcadm (sync-roles.sh) necesita el base URL
  # con /auth, si no queda en "esperando Keycloak..." y timeoutea (no re-aplica roles
  # ni redirect URIs). El resto de la config viene del compose base.
  keycloak-config:
    environment:
      KC_SERVER: http://keycloak:8080/auth

  backend:
    environment:
      # Perfil 'demo' (no existe como archivo => aplica solo application.yml base, que ya trae
      # seguridad JWK-only). Clave: el DevDataSeeder está gated con @Profile("dev"), así que en
      # 'demo' NO corre => la DB queda vacía salvo lo que siembran las migraciones (V029: catálogo
      # editorial = libros + colecciones + autoras). El resto de la config sigue igual que dev.
      SPRING_PROFILES_ACTIVE: demo
      # Keycloak ahora sirve bajo /auth -> el JWK set se mueve de ruta.
      # Sin esto el backend no puede validar la firma del JWT (404 al bajar los certs => 500).
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/imedba/protocol/openid-connect/certs
      # Módulo Personal: el backend llama a la Admin API de Keycloak (grant password
      # contra realm master). Con Keycloak bajo /auth, la base-url tiene que incluir /auth,
      # si no la auth admin da 404 -> KeycloakAdminException -> 502 en GET /api/v1/users.
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080/auth
      # CORS: el navegador manda header Origin en TODO POST/PUT/DELETE (aunque sea
      # same-origin). El backend valida ese Origin contra esta lista (exacta). Sin el
      # origen del túnel acá, el GET anda (same-origin GET no manda Origin) pero el POST
      # da 403 "Invalid CORS request". Se setea la URL del túnel en el .env (env-specific).
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}

  frontend:
    build:
      args:
        VITE_API_BASE_URL: /api
        VITE_KEYCLOAK_URL: /auth
    image: imedba/frontend:demo

  nginx:
    image: nginx:1.27-alpine
    container_name: imedba-nginx-demo
    restart: unless-stopped
    depends_on: [backend, keycloak, frontend]
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/demo.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [imedba-net]

spring:
  application:
    name: imedba-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: ${TZ:America/Argentina/Buenos_Aires}
    default-property-inclusion: non_null
  mail:
    # SMTP del proveedor de mail (Resend: host smtp.resend.com, user 'resend', pass = API key).
    # Con MAIL_SMTP_HOST vacío el SmtpMailSender queda inactivo (→ Noop).
    host: ${MAIL_SMTP_HOST:}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_SMTP_USERNAME:}
    password: ${MAIL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/imedba}
    username: ${SPRING_DATASOURCE_USERNAME:imedba}
    password: ${SPRING_DATASOURCE_PASSWORD:imedba_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: ${TZ:America/Argentina/Buenos_Aires}
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # En dev no validamos `iss`: el browser pide tokens a localhost:8081
          # mientras que el backend ve Keycloak por la red interna como
          # `http://keycloak:8080`. Spring valida firma vía JWK; eso alcanza para
          # dev local. En prod (application-prod.yml) seteamos ambos contra el
          # dominio público.
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8081/realms/imedba/protocol/openid-connect/certs}

server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${SENDGRID_FROM_EMAIL:no-reply@imedba.local}
  from-name: ${SENDGRID_FROM_NAME:IMEDBA}

# Remitente del mail. El dominio de MAIL_FROM_ADDRESS debe estar verificado en el proveedor
# (Resend). Sin dominio verificado sólo se puede mandar desde onboarding@resend.dev al mail
# de la cuenta. Usado por el adapter SMTP.
mail:
  from:
    # Remitente por defecto = "informes". Lo usan contrato, bienvenida y avisos internos.
    address: ${MAIL_FROM_ADDRESS:no-reply@imedba.local}
    name: ${MAIL_FROM_NAME:IMEDBA}
    # Casilla de cobranzas: cuotas, matrícula, recargos y suspensión por mora. Si queda
    # VACÍA, todo sale del remitente de arriba (comportamiento previo a este cambio).
    # El dominio tiene que estar verificado en Resend igual que el otro.
    cobranzas:
      address: ${MAIL_FROM_COBRANZAS_ADDRESS:}
      name: ${MAIL_FROM_COBRANZAS_NAME:}

# Integración Moodle (LMS). Deshabilitada por default: hasta que David pase URL + token,
# el MoodleClient es inerte (loguea, no llama a la red). Para activar: MOODLE_ENABLED=true
# + MOODLE_URL + MOODLE_TOKEN.
moodle:
  enabled: ${MOODLE_ENABLED:false}
  base-url: ${MOODLE_URL:}
  token: ${MOODLE_TOKEN:}
  default-student-role-id: ${MOODLE_DEFAULT_STUDENT_ROLE_ID:5}
  # Suspensión automática por mora (scheduler 06:10 + catch-up). Separado de `enabled`:
  # se puede prender la integración para lookup/vincular/suspender-manual SIN suspender
  # morosos reales en masa. Flip a true recién cuando esté validado en prod.
  auto-suspend-enabled: ${MOODLE_AUTO_SUSPEND_ENABLED:false}
  connect-timeout-ms: ${MOODLE_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${MOODLE_READ_TIMEOUT_MS:10000}

# Canal WhatsApp (nuevo). Sin proveedor real aún: NoopWhatsAppSender loguea y no envía.
whatsapp:
  enabled: ${WHATSAPP_ENABLED:false}

# Gestión de usuarios vía Keycloak Admin REST API (módulo Personal, SOLO admin).
# En dev autenticamos con el admin del realm `master` (admin-cli) — anda out-of-the-box
# con el admin/admin del compose, sin tocar service-account roles. En prod: usar un
# service account dedicado con rol `manage-users` (ver doc 11-modulo-personal-usuarios.md).
keycloak:
  admin:
    enabled: ${USER_ADMIN_ENABLED:true}
    base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://keycloak:8080}
    realm: ${KEYCLOAK_REALM:imedba}
    admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    connect-timeout-ms: ${KEYCLOAK_ADMIN_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${KEYCLOAK_ADMIN_READ_TIMEOUT_MS:10000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validación de `iss`: OBLIGATORIA en prod. Sin default a propósito.
          #
          # OJO — acá vivía un bug real (deploy 2026-08-25). Decía
          # `${...:}`, o sea default = string VACÍO. El auto-config de Spring hace:
          #     issuerUri != null ? createDefaultWithIssuer(issuerUri) : createDefault()
          # Chequea != null, NO si tiene contenido. String vacío NO es null => armaba un
          # JwtIssuerValidator("") que exige iss == "" => NINGÚN token pasaba nunca. El
          # backend levantaba perfecto y devolvía 401 a todo, con
          # "The iss claim is not valid" escondido en el header WWW-Authenticate.
          #
          # Tampoco sirve `${...:#{null}}`: el SpEL #{} lo evalúa @Value, no el binder de
          # @ConfigurationProperties, así que bindearía el literal "#{null}".
          #
          # Sin default, si la variable falta el arranque falla con un error explícito de
          # placeholder. El compose además la exige con ${KEYCLOAK_ISSUER_URI:?...}, así que
          # el error salta en el `up`, antes de levantar nada. Fallar fuerte > fallar mudo.
          #
          # Formato: https://<SERVER_NAME>/auth/realms/imedba
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      max-lifetime: 1800000
      idle-timeout: 600000

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 20MB
    connection-timeout: 20000
    max-connections: 10000
    threads:
      max: 200
      min-spare: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false
    git:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.imedba: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

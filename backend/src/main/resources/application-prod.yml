spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validación de `iss` OPCIONAL: se activa solo si KEYCLOAK_ISSUER_URI trae
          # valor. Vacío (default) => Spring valida solo la firma vía JWK (fetch interno
          # a Keycloak) + timestamps, sin atarse a un hostname público. Esto hace que el
          # backend acepte tokens venga con el `iss` que venga (localhost, túnel Cloudflare
          # con hostname random, dominio real) sin romperse. Cuando tengas un dominio fijo
          # y quieras defensa-en-profundidad, seteá KEYCLOAK_ISSUER_URI y vuelve a validar.
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      max-lifetime: 1800000
      idle-timeout: 600000

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 20MB
    connection-timeout: 20000
    max-connections: 10000
    threads:
      max: 200
      min-spare: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false
    git:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.imedba: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

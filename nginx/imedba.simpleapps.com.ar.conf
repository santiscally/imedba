# imedba.simpleapps.com.ar — demo IMEDBA, nginx nativo del sistema (no Docker).
#
# Reemplaza al quick tunnel de cloudflared: URL fija y permanente.
# Todo el ruteo fino (/ -> SPA, /api -> backend, /auth -> Keycloak) lo hace el
# nginx-demo DENTRO de compose, publicado en 127.0.0.1:8090. Acá sólo terminamos
# TLS y le pasamos todo, preservando el Host original.
#
# El bloque 443 lo agrega certbot al emitir el cert (o se agrega a mano después).

server {
    listen 80;
    listen [::]:80;
    # El hostname de DonWeb ya resuelve a este server: sirve como URL fija
    # inmediata, sin depender del A record de imedba.simpleapps.com.ar.
    server_name imedba.simpleapps.com.ar vps-4740477-x.dattaweb.com;

    # Challenge de Let's Encrypt (webroot: no hace falta parar nginx).
    # Va ANTES del proxy: ^~ gana sobre el location / de abajo.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # El nginx interno ya limita a 20m; sin esto el límite de acá (1m por
    # defecto) rechazaría los uploads antes de que lleguen al de adentro.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Keycloak puede tardar en respuestas de token bajo carga fría.
        proxy_read_timeout 120s;
    }
}

# HTTPS por el hostname de DonWeb. Es el link ESTABLE del demo: no depende de
# cloudflared ni de que se cree el A record de imedba.simpleapps.com.ar.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vps-4740477-x.dattaweb.com;

    ssl_certificate     /etc/letsencrypt/live/vps-4740477-x.dattaweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps-4740477-x.dattaweb.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
    }
}

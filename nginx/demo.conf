# Reverse proxy HTTP (sin TLS) para el DEMO expuesto por túnel.
# El túnel (cloudflared) termina TLS afuera; acá adentro va todo HTTP.
#   /       -> frontend (SPA)
#   /api/   -> backend Spring Boot (context path /api)
#   /auth/  -> Keycloak (KC_HTTP_RELATIVE_PATH=/auth)
# El SPA usa URLs relativas (VITE_API_BASE_URL=/api, VITE_KEYCLOAK_URL=/auth),
# así que todo vive bajo un solo origen -> un solo túnel alcanza.

server {
    listen 80 default_server;
    server_name _;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    client_max_body_size 20m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # El túnel (cloudflared) SIEMPRE termina TLS de cara al cliente, pero llega
    # acá por HTTP. Forzamos X-Forwarded-Proto=https para que Keycloak (KC_PROXY=edge,
    # realm sslRequired=external) trate la conexión como segura y no rechace con
    # "HTTPS required". Igual sirve si se accede local por http (backend ignora el iss).
    # --- Backend API ---
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_read_timeout 60s;
    }

    # --- Keycloak (relative path /auth) ---
    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_read_timeout 120s;
    }

    # --- SPA ---
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

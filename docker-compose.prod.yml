# Override de producción.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Agrega:
#   - Nginx TLS en 80/443 (frontal)
#   - Keycloak en modo optimized con /auth + hostname estricto
#   - Backend en SPRING_PROFILES_ACTIVE=prod + healthcheck + límites de memoria
#   - Límites de recursos y reservas en todos los servicios.
#
# Los puertos internos siguen bindeados a 127.0.0.1 (definidos en el base);
# nginx llega a los servicios por la red interna Docker.

services:
  db:
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-1G}
        reservations:
          memory: 256M

  keycloak:
    command: ["start", "--import-realm", "--optimized"]
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      # STRICT=false: no rechaza requests cuyo Host != KC_HOSTNAME. Necesario cuando entrás
      # por un hostname distinto al configurado (túnel Cloudflare). Puro relax, no rompe el login.
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    deploy:
      resources:
        limits:
          memory: ${KC_MEM_LIMIT:-1G}
        reservations:
          memory: 384M

  # Keycloak sirve bajo /auth en prod (KC_HTTP_RELATIVE_PATH) -> kcadm necesita el base URL
  # CON /auth. El compose base lo tiene hardcodeado sin el subpath y este override no lo pisaba:
  # sin esto sync-roles.sh se queda en "esperando Keycloak...", timeoutea y NO aplica roles ni
  # permisos -> todos los endpoints con @PreAuthorize devuelven 403. Mismo override que demo.
  keycloak-config:
    environment:
      KC_SERVER: http://keycloak:8080/auth

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # issuer-uri VACÍO por default => validación solo por firma JWK (hostname-agnostic:
      # sirve para el túnel Cloudflare que cambia de hostname). Seteá KEYCLOAK_ISSUER_URI
      # en el .env solo cuando tengas un dominio fijo y quieras validar el `iss`.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-}
      # JWK interno (backend -> keycloak por red Docker). Default con /auth (prod usa
      # KC_HTTP_RELATIVE_PATH=/auth) para que ande aunque el .env no lo setee.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/auth/realms/imedba/protocol/openid-connect/certs}
      # SPA y API van por el mismo origen detrás de nginx => CORS casi nunca se dispara.
      # Igual dejamos el dominio fijo + wildcard de quick-tunnels por si algo pega cross-origin.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://${SERVER_NAME}}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEM_LIMIT:-1536M}
        reservations:
          memory: 512M

  frontend:
    build:
      args:
        VITE_API_BASE_URL: /api
        VITE_KEYCLOAK_URL: /auth
    image: imedba/frontend:prod
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEM_LIMIT:-256M}

  nginx:
    image: nginx:1.27-alpine
    container_name: imedba-nginx
    restart: unless-stopped
    depends_on: [backend, keycloak, frontend]
    environment:
      SERVER_NAME: ${SERVER_NAME}
      NGINX_ENVSUBST_FILTER: "^SERVER_NAME$$"
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [imedba-net]
    deploy:
      resources:
        limits:
          memory: ${NGINX_MEM_LIMIT:-128M}

name: imedba

# Stack de desarrollo. Una sola Postgres con dos DBs adentro (imedba + keycloak).
# Puertos bindeados a 127.0.0.1 para no exponerlos fuera del host.
# Para prod: `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`
# (agrega nginx TLS y cambia Keycloak a modo produccion).

services:
  db:
    image: postgres:16-alpine
    container_name: imedba-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imedba}
      POSTGRES_USER: ${POSTGRES_USER:-imedba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imedba_dev}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - imedba_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-imedba}"]
      interval: 5s
      retries: 10
    networks: [imedba-net]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: imedba-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-imedba}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-imedba_dev}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    networks: [imedba-net]

  # Aplica roles + permisos al realm en cada `up` (idempotente; NO toca el resto del
  # realm: usuarios, clients, login). Necesario porque `--import-realm` no re-importa
  # un realm ya existente. Ver keycloak/sync-roles.sh. Corre, aplica y sale.
  keycloak-config:
    image: quay.io/keycloak/keycloak:25.0
    container_name: imedba-keycloak-config
    restart: "no"
    depends_on:
      keycloak:
        condition: service_started
    environment:
      KC_SERVER: http://keycloak:8080
      KC_REALM: ${VITE_KEYCLOAK_REALM:-imedba}
      KC_CLIENT: imedba-backend
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Para re-aplicar los redirect URIs del client público en cada `up` (ver sync-roles.sh).
      # SERVER_NAME = dominio fijo (prod); FRONTEND_REDIRECT_URIS_EXTRA = lista extra separada
      # por coma (ej. otro dominio). El wildcard de quick-tunnels ya va hardcodeado en el script.
      SERVER_NAME: ${SERVER_NAME:-}
      FRONTEND_REDIRECT_URIS_EXTRA: ${FRONTEND_REDIRECT_URIS_EXTRA:-}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    volumes:
      - ./keycloak/sync-roles.sh:/sync-roles.sh:ro
    entrypoint: ["/bin/bash", "/sync-roles.sh"]
    networks: [imedba-net]

  backend:
    build:
      context: ./backend
    image: imedba/backend:dev
    container_name: imedba-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-imedba}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-imedba}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-imedba_dev}
      # En dev NO validamos iss (mismatch localhost:8081 vs keycloak:8080 interno).
      # Spring valida firma vía JWK; alcanza para dev local.
      # Prod (override) sí setea issuer-uri al dominio público.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/imedba/protocol/openid-connect/certs}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-no-reply@imedba.local}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-IMEDBA}
      # AWS SES por SMTP (proveedor de mail activo). Sin SES_SMTP_HOST queda el NoopMailSender.
      SES_SMTP_HOST: ${SES_SMTP_HOST:-}
      SES_SMTP_PORT: ${SES_SMTP_PORT:-587}
      SES_SMTP_USERNAME: ${SES_SMTP_USERNAME:-}
      SES_SMTP_PASSWORD: ${SES_SMTP_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@imedba.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-IMEDBA}
      # Alternativa por API (HTTPS 443) si el hosting bloquea el SMTP saliente. Requiere
      # credenciales IAM (access key/secret), NO las SMTP. Dormido salvo AWS_SES_FROM_EMAIL.
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL:-}
      AWS_SES_FROM_NAME: ${AWS_SES_FROM_NAME:-IMEDBA}
      AWS_SES_REGION: ${AWS_SES_REGION:-sa-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Moodle (LMS) — inerte hasta tener token de David. Activar: MOODLE_ENABLED=true + URL + TOKEN.
      MOODLE_ENABLED: ${MOODLE_ENABLED:-false}
      MOODLE_URL: ${MOODLE_URL:-}
      MOODLE_TOKEN: ${MOODLE_TOKEN:-}
      MOODLE_DEFAULT_STUDENT_ROLE_ID: ${MOODLE_DEFAULT_STUDENT_ROLE_ID:-5}
      # Suspensión automática por mora. Separado de MOODLE_ENABLED: prendé la integración
      # primero (lookup/vincular/suspender-manual) y recién flipeá esto cuando esté validado.
      MOODLE_AUTO_SUSPEND_ENABLED: ${MOODLE_AUTO_SUSPEND_ENABLED:-false}
      # Módulo Personal: gestión de usuarios vía Keycloak Admin API (red interna).
      # En dev usa el admin del realm master (admin/admin). Prod: service account dedicado.
      KEYCLOAK_ADMIN_BASE_URL: ${KEYCLOAK_ADMIN_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-imedba}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      USER_ADMIN_ENABLED: ${USER_ADMIN_ENABLED:-true}
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks: [imedba-net]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-imedba}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-imedba-frontend}
    image: imedba/frontend:dev
    container_name: imedba-frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    networks: [imedba-net]

volumes:
  imedba_db_data:

networks:
  imedba-net:
    driver: bridge
